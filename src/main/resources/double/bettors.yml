# MENU GUI, SHOWN WHEN THE PLAYER USES /blaze AND CLICKS ON double AND THEN ON bettors

title: 'Double - Bettors'

items:

  empty:
    use-head: false # if true, ignores 'id' and 'data' below
    texture: ''
    id: 'BARRIER'
    data: 0
    glow: false
    name: '&cEmpty'
    lore:
      - '&7Nobody is betting right now...'
    slot: 22

  player:
    use-head-player: true # Uses the head of whoever bet as the item
    use-head: false # if true, ignores 'id' and 'data' below
    texture: ''
    id: ''
    data: 0
    glow: false
    name: '&b{nick}'
    lore:
      - '&7Player: &e{nick}'
      - ''
      - '&7Bet on: {color}'
      - ''
      - '&7Amount (money): &a{money}'
      - '&7Amount (cash): &6{cash}'
      - ''
      - '&7Status: {status}'
      - ''
      - '&7Winnings (money): &b{total-won-money}'
      - '&7Winnings (cash): &b{total-won-cash}'
      - ''
      - '&7Bet ID: &f#{id}'
    bet-red: '&cRED' # Setting of the {color} variable in the following cases
    bet-white: '&fWHITE'
    bet-black: '&8PRETO'
    status-won: '&bWon ({multiplier}x)' # Setting of the {status} variable in the following cases
    status-lost: '&cLost...'
    status-waiting: '&eWaiting for result...'

  back:
    use-head: false # if true, ignores 'id' and 'data' below
    texture: ''
    id: 'REDSTONE'
    data: 0
    glow: false
    name: '&cBack'
    lore:
      - '&7Click to go back to the previous menu'
    slot: 49

  next-page:
    use-head: true # if true, ignores 'id' and 'data' below
    texture: 'http://textures.minecraft.net/texture/f2f3a2dfce0c3dab7ee10db385e5229f1a39534a8ba2646178e37c4fa93b'
    id: ''
    data: 0
    glow: false
    name: '&aNext page'
    lore:
      - '&7Click to go forward to'
      - '&7the next page.'
    slot: 50 # Slot where the item will appear if there is more than one page

  previous-page:
    use-head: true # if true, ignores 'id' and 'data' below
    texture: 'http://textures.minecraft.net/texture/bb0f6e8af46ac6faf88914191ab66f261d6726a7999c637cf2e4159fe1fc477'
    id: ''
    data: 0
    glow: false
    name: '&cPrevious page'
    lore:
      - '&7Click to go back to'
      - '&7the previous page.'
    slot: 48 # Slot where the item will appear if there is more than one page

