# MENU GUI, SHOWN WHEN THE PLAYER USES /apostar AND CLICKS ON animal game AND ON bet AND THEN ON the animal

title: 'Animal Game - Bet'

rows: 3

items:

  money:
    use-head: false # if true, ignores 'id' and 'data' below
    texture: ''
    id: 'EMERALD'
    data: 0
    glow: false
    name: '&aMoney'
    lore:
      - '&7Amount to be bet: &a{money}'
      - ''
      - '&7* Click to change'
    slot: 11

  cash:
    use-head: false # if true, ignores 'id' and 'data' below
    texture: ''
    id: 'GOLD_INGOT'
    data: 0
    glow: false
    name: '&6Cash'
    lore:
      - '&7Amount to be bet: &6{cash}'
      - ''
      - '&7* Click to change'
    slot: 12

  bet:
    use-head-animal: true # if true, ignores 'id' and 'data' below
    use-head: false # if true, ignores 'id' and 'data' below
    texture: ''
    id: ''
    data: 0
    glow: false
    name: '&6Bet'
    lore:
      - '&7Animal: &b{animal}'
      - ''
      - '&7Amount to be bet: &a{money}'
      - '&7Amount to be bet: &6{cash}'
      - ''
      - '&7Click to bet on this animal'
    slot: 14

  bettors:
    use-head-last-player: true # if true, uses the head of the last player as the item
    use-head: false # if true, ignores 'id' and 'data' below
    texture: ''
    id: ''
    data: 0
    glow: false
    name: '&eBettors'
    lore:
      - '&7Players who bet on this animal: &b{players}'
      - '&7Last player to bet: &b{last-player}'
      - ''
      - '&7Total money bet: &a{total-money}'
      - '&7Total cash bet: &6{total-cash}'
      - ''
      - '&7Click to see more details and'
      - '&7all the players who bet'
      - '&7on this animal.'
    slot: 15

  back:
    use-head: false # if true, ignores 'id' and 'data' below
    texture: ''
    id: 'REDSTONE'
    data: 0
    glow: false
    name: '&cBack'
    lore:
      - '&7Click to go back to the previous menu'
    slot: 26

