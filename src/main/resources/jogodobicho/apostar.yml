      - ''
      - '&7* Clique para alterar'
    Slot: 12

  apostar:
    Usar-head-bicho: true # caso true, ignora 'Id' e 'Data' abaixo
    Usar-head: false # caso true, ignora 'Id' e 'Data' abaixo
    Textura: ''
    Id: ''
    Data: 0
    Glow: false
    Nome: '&6Apostar'
    Lore:
      - '&7Animal: &b{animal}'
      - ''
      - '&7Quantia que vai ser apostada: &a{money}'
      - '&7Quantia que vai ser apostada: &6{cash}'
      - ''
      - '&7Clique para apostar nesse animal'
    Slot: 14

  apostadores:
    Usar-head-ultimo-player: true # caso true, usa a cabeça do último jogador como item
    Usar-head: false # caso true, ignora 'Id' e 'Data' abaixo
    Textura: ''
    Id: ''
    Data: 0
    Glow: false
    Nome: '&eApostadores'
    Lore:
      - '&7Jogadores que apostaram nesse bicho: &b{jogadores}'
      - '&7Ultimo jogador que apostou: &b{last_player}'
      - ''
      - '&7Total money apostado: &a{total_money}'
      - '&7Total cash apostado: &6{total_cash}'
      - ''
      - '&7Clique para ver mais detalhes e'
      - '&7todos os jogadores que apostaram'
      - '&7neste animal.'
    Slot: 15

  voltar:
    Usar-head: false # caso true, ignora 'Id' e 'Data' abaixo
    Textura: ''
    Id: 'REDSTONE'
    Data: 0
    Glow: false
    Nome: '&cVoltar'
    Lore:
      - '&7Clique para voltar ao menu anterior'
    Slot: 26

