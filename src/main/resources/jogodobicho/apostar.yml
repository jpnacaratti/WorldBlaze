# MENU GUI PRINCIPAL, APARECE QUANDO O JOGADOR UTILIZAR /apostar E CLICAR NO jogo do bicho E EM apostar E DEPOIS no bicho

Titulo: 'Jogo do Bicho - Apostar'

Linhas: 3

Itens:

  money:
    Usar-head: false # caso true, ignora 'Id' e 'Data' abaixo
    Textura: ''
    Id: 'EMERALD'
    Data: 0
    Glow: false
    Nome: '&aMoney'
    Lore:
      - '&7Quantia que vai ser apostada: &a{money}'
      - ''
      - '&7* Clique para alterar'
    Slot: 11

  cash:
    Usar-head: false # caso true, ignora 'Id' e 'Data' abaixo
    Textura: ''
    Id: 'GOLD_INGOT'
    Data: 0
    Glow: false
    Nome: '&6Cash'
    Lore:
