# MENU GUI, SHOWN WHEN THE PLAYER USES /blaze AND CLICKS ON mine AND THEN ON create AND FINALLY CONFIRMS

title: 'WorldBlaze - CoinFlip'

rows: 3

coin-slot: 13

starting:
  use-head: true # if true, ignores 'id' and 'data' below
  texture: 'https://textures.minecraft.net/texture/a34b27bfcc8f9b964594b618b1146af69de278ce5e2e3012cb471a9a3cf3871'
  id: ''
  data: 0
  glow: false
  name: '&eStarting...'
  lore:
    - ''
    - '&7Starts in: {time}s'
    - ''
    - '&7Amount bet (money): &a{money}'
    - '&7Amount bet (cash): &6{cash}'
    - ''
    - '&f{owner-player} &7- &e{owner-choice}'
    - '&f{opponent-player} &7- &e{opponent-choice}'

finished:
  name: '&cFINISHED'
  lore:
    - ''
    - '&7Finished'
    - '&7Chosen side: &b{final-choice}'
    - ''
    - '&7Winning player: &e{winner}'
    - ''
    - '&7Amount won (money): &a{money}'
    - '&7Amount won (cash): &6{cash}'

heads:
  use-head: true # if true, ignores 'id' and 'data' below
  texture: 'https://textures.minecraft.net/texture/a34b27bfcc8f9b964594b618b1146af69de278ce5e2e3012cb471a9a3cf3871'
  id: ''
  data: 0
  glow: false
  name: '&eHEADS'
  lore:
    - ''
    - '&bChoice: &bHEADS'
    - ''
    - '&7Amount bet (money): &a{money}'
    - '&7Amount bet (cash): &6{cash}'
    - ''
    - '{color}-> &f{owner-player} &7- &e{owner-choice}'
    - '{color}-> &f{opponent-player} &7- &e{opponent-choice}'

tails:
  use-head: true # if true, ignores 'id' and 'data' below
  texture: 'https://textures.minecraft.net/texture/a34b27bfcc8f9b964594b618b1146af69de278ce5e2e3012cb471a9a3cf3871'
  id: ''
  data: 0
  glow: false
  name: '&eTAILS'
  lore:
    - ''
    - '&bChoice: &bTAILS'
    - ''
    - '&7Amount bet (money): &a{money}'
    - '&7Amount bet (cash): &6{cash}'
    - ''
    - '{color}-> &f{owner-player} &7- &e{owner-choice}'
    - '{color}-> &f{opponent-player} &7- &e{opponent-choice}'

chosen-color: "&b"
not-chosen-color: "&f"

items:

  owner:
    use-head-player: true # Uses the player's head as the item
    use-head: false # if true, ignores 'id' and 'data' below
    texture: ''
    id: 'BARRIER'
    data: 0
    glow: false
    name: '&e{nick}'
    lore:
      - ''
      - '&7Bet on: &b{owner-choice}'
      - ''
    slot: 9

