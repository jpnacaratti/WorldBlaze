# MENU GUI PRINCIPAL, APARECE QUANDO O JOGADOR UTILIZAR /apostar E CLICAR NO mine E DEPOIS EM criar E POR FIM CONFIRMAR

Titulo: 'WorldBlaze - CoinFlip'

Linhas: 3

Slot-moeda: 13

iniciando:
  Usar-head: true # caso true, ignora 'Id' e 'Data' abaixo
  Textura: 'https://textures.minecraft.net/texture/a34b27bfcc8f9b964594b618b1146af69de278ce5e2e3012cb471a9a3cf3871'
