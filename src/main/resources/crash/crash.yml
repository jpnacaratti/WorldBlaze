# MENU GUI PRINCIPAL, APARECE QUANDO O JOGADOR UTILIZAR /apostar E CLICAR EM crash

title: 'WorldBlaze - Crash'

rows: 1

starting-color: 4 # Data do painel de vidro que vai ficar no menu quando ele estiver começando
started-color: 5 # Data do painel de vidro que vai ficar no menu quando ele ja estiver começado
crash-color: 14 # Data do painel de vidro que vai ficar no menu quando o crash acabar/crashar

# Slots que vão ficar os paineis de vidro
glass-slots: [2, 3, 5, 6]

items:

  money:
    use-head: false # caso true, ignora 'id' e 'data' abaixo
    texture: ''
    id: 'EMERALD'
    data: 0
    glow: false
    name: '&aMoney'
    lore:
      - '&7Quantia que vai ser apostada: &a{money}'
      - ''
      - '&7* Clique para alterar'
    slot: 0

  cash:
    use-head: false # caso true, ignora 'id' e 'data' abaixo
    texture: ''
    id: 'GOLD_INGOT'
    data: 0
    glow: false
    name: '&6Cash'
    lore:
      - '&7Quantia que vai ser apostada: &6{cash}'
      - ''
      - '&7* Clique para alterar'
    slot: 1

  # Item do meio do menu que vai passar as informações do crash antes dele iniciar
  crash-starting:
    use-head: true # caso true, ignora 'id' e 'data' abaixo
    texture: 'https://textures.minecraft.net/texture/cd15b5d79bedadc145fa17cc36a2e0c9b088b4ee74f86ea588bd1ad8cdbd22'
    id: ''
    data: 0
    glow: false
    name: '&eIniciando...'
    lore:
      - '&7O Crash vai iniciar em: &e{tempo}s'
      - ''
      - '&7Status: {status-iniciando}'
      - ''
      - '&7Quantia que vai ser apostada: &a{money}'
      - '&7Quantia que vai ser apostada: &6{cash}'
      - ''
      - '&7Caso não esteja participando,'
      - '&7clique para entrar e apostar.'
    status-participating: '&aVocê já está participando.' # Configurações da variável {status}
    status-participate: '&cVocê não está participando.'
    slot: 4

  # Item do meio do menu que vai passar as informações do crash enquanto ele estiver rodando
  crash-started:
    use-head: true # caso true, ignora 'id' e 'data' abaixo
    texture: 'https://textures.minecraft.net/texture/bf6b85f626444dbd5bddf7a521fe52748fe43564e03fbd35b6b5e797de942d'
    id: ''
    data: 0
    glow: false
    name: '&aIniciado: &e{valor}&7x'
    lore:
      - '&7Multiplicador atual: &e{valor}&7x'
      - ''
      - '&7Status: {status-iniciado}'
      - ''
      - '&7Você apostou (money): &f{money-apostado}'
      - '&7Você apostou (cash): &f{cash-apostado}'
      - ''
      - '&7Caso esteja participando'
      - '&7clique para sair'
    status-did-not-participate: '&cVocẽ não está participando' # Configurações da variável {status}
    status-participating: '&aClique para sair'
    status-exited: '&cSaiu com {valor-saida}x'
    slot: 4

  # Item do meio do menu que vai passar as informações do crash quando ele crashar
  crash-crashed:
    use-head: true # caso true, ignora 'id' e 'data' abaixo
    texture: 'https://textures.minecraft.net/texture/bf6b85f626444dbd5bddf7a521fe52748fe43564e03fbd35b6b5e797de942d'
    id: ''
    data: 0
    glow: false
    name: '&cCrashou: &e{valor}&7x'
    lore:
      - '&7Crashou em: &e{valor}&7x'
      - ''
      - '&7Status: {status-crashou}'
      - ''
      - '&7Ganhos (money): &a{ganho-money}'
      - '&7Ganhos (cash): &6{ganho-cash}'
      - ''
      - '&7Você apostou (money): &f{money-apostado}'
      - '&7Você apostou (cash): &f{cash-apostado}'
      - ''
      - '&7Aguarde que em breve vai'
      - '&7começar mais um crash'
    status-did-not-participate: '&cVocẽ não participou' # Configurações da variável {status}
    status-lost: '&cDemorou muito para sair...'
    status-won: '&aSaiu com &l{valor-saida}&ax'
    slot: 4

  history:
    use-head: true # caso true, ignora 'id' e 'data' abaixo
    texture: 'https://textures.minecraft.net/texture/ed6b8584e938c805da55b24ba2f027f3bcbd1b5434ef649b8583934fa1b64b44'
    id: ''
    data: 0
    glow: false
    name: '&6Histórico'
    lore:
      - '&7Histórico recente do crash'
      - '&7para você se basear:'
      - '&7- &e{historico}&7x' # Vai ser repetida para todos os últimos 15 valores
    slot: 7

  bettors:
    use-head-last-player: true # caso true, o ícone vai ser a cabeça do último jogador que apostou
    use-head: false # caso true, ignora 'id' e 'data' abaixo
    texture: ''
    id: ''
    data: 0
    glow: false
    name: '&eApostadores'
    lore:
      - '&7Jogadores apostando: &b{jogadores}'
      - '&7Ultimo jogador que apostou: &b{last_player}'
      - ''
      - '&7Total money apostado: &a{total_money}'
      - '&7Total cash apostado: &6{total_cash}'
      - ''
      - '&7Clique para ver mais detalhes e'
      - '&7todos os jogadores que apostaram.'
    slot: 8