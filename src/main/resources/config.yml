    - ''

  Ganhou-mine:
    - ''
    - '&c[Mine] §7Você saiu do mine com um multiplicador de &c&l{multiplicador}x &7e ganhou &c{money} &7money e &c{cash} &7cash!'
    - ''

  Espectadores-acabou:
    - '&cO jogador que estava jogando essa partida finalizou, esse menu não será mais atualizado!'
