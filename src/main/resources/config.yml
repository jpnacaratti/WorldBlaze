  broadcast-cashed-out-crash:
    - ''
    - '&a[Crash] &7O jogador &a{player} &7retirou em &a&l{crash}x &7e ganhou &a{money} &7coins e &a{cash} &7cash!'
    - ''

  won-crash:
    - ''
    - '&a[Crash] &7Você saiu antes de crashar e ganhou &a{money} &7money e &a{cash} &7cash!'
    - ''

  lost-crash:
    - ''
    - '&a[Crash] &7Você não saiu antes de crashar e perdeu &a{money} &7money e &a{cash} &7cash!'
    - ''

  joined-crash:
    - ''
    - '&6[WorldBlaze] &7Você está participando agora do crash!'
    - ''

  # Configuração das mensagens do Graph

  # Quando jogador clicar para diminuir o tempo do update porém passou do limite permitido
  cannot-decrease-update: '&cVocê não pode diminuir mais o tempo que isso!'

  # Quando jogador clicar para aumentar o tempo do update porém passou do limite permitido
  cannot-increase-update: '&cVocê não pode aumentar mais o tempo que isso!'

  # Quando jogador clicar em definir o dinheiro que vai ser apostado no Graph
  graph-typing-money:
    - ''
    - '&aDigite a quantia de &7money &aque quer apostar'
    - '&aPara cancelar digite &7"cancelar"'
    - ''

  # Quando jogador clicar em definir o cash que vai ser apostado no Graph
  graph-typing-cash:
    - ''
    - '&aDigite a quantia de &7cash &aque quer apostar'
    - '&aPara cancelar digite &7"cancelar"'
    - ''

  # Quando jogador for apostar mas tem que esperar o intervalo de aposta do Graph
  wait-before-betting: '&cVocê tem que esperar {tempo} segundos antes de apostar de novo!'

  # Servidor iniciou e infeliz foi tentar apostar antes mesmo de qualquer update sair
  graph-starting: '&cAguarde um pouco antes de apostar!'

  # Quando jogador apostar no Graph
  graph-bet-placed: '&6[WorldBlaze] &7Apostou no point &6{point}'

  graph-draw:
    - ''
    - '&d[WorldBlaze] &7Sua aposta no &dGraph &7acabou em um empate, seu dinheiro foi devolvido!'
    - ''

  graph-won:
    - ''
    - '&d[WorldBlaze] &7Sua aposta no &dGraph &7deu certo e rendeu um total de &d{money} &7money e &d{cash} &7cash!'
    - ''

  graph-lost:
    - ''
    - '&d[WorldBlaze] &7Sua aposta no &dGraph &7deu errado e você perdeu um total de &d{money} &7money e &d{cash} &7cash!'
    - ''

  # Configuração das mensagens do Jogo do Bicho

  # Quando o bicho do /jogodobicho sortear <bicho> for inválido
  invalid-animal: '&cBicho inválido, escolha novamente!'

  # Quando sortearem um bicho
  animal-drawn-broadcast:
    - ''
    - '&e[Jogo do Bicho] &7O bicho sorteado da vez foi: &e{bicho}'
    - ''

  # Quando algum jogador ganhar e passar da quantidade de dinheiro que precisa para mandar um alerta
  broadcast-animal-profit:
    - '&e[Jogo do Bicho] &7O jogador &e{player} &7ganhou &e{money} &7money e &e{cash} &7cash!'

  # Quando jogador ganhar no jogo do bicho
  won-jogo-do-bicho:
    - ''
    - '&e[Jogo do Bicho] &7Você ganhou &e{money} &7money e &e{cash} &7cash!'
    - ''

  # Quando jogador perder no jogo do bicho
  lost-jogo-do-bicho:
    - ''
    - '&e[Jogo do Bicho] &7Você perdeu...'
    - ''

  # Quando staff digitar /jogodobicho sortear
  animal-drawn: '&aBicho sorteado'

  # Quando jogador clicar em definir o dinheiro que vai ser apostado no Jogo do Bicho
  jogo-do-bicho-typing-money:
    - ''
    - '&aDigite a quantia de &7money &aque quer apostar'
    - '&aPara cancelar digite &7"cancelar"'
    - ''

  # Quando jogador clicar em definir o cash que vai ser apostado no Jogo do Bicho
  jogo-do-bicho-typing-cash:
    - ''
    - '&aDigite a quantia de &7cash &aque quer apostar'
    - '&aPara cancelar digite &7"cancelar"'
    - ''

  # Quando jogador clicar para apostar em um animal específico porém já apostou no mesmo
  already-bet-on-animal: '&cVocê já apostou nesse animal!'

  # Quando jogador apostar em algum animal
  bet-placed-animal:
    - ''
    - '&e[Jogo do Bicho] &7Apostou com sucesso no &e{animal}'
    - ''

  insufficient-money: '&cVocê não possui essa quantia de money!'
  insufficient-cash: '&cVocê não possui essa quantia de cash!'

